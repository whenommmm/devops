apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-api
  template:
    metadata:
      labels:
        app: lab-api
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api-svc
spec:
  selector:
    app: lab-api
  ports:
    - port: 80
      targetPort: 8080
