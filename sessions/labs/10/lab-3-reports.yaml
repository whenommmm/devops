apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-reports
  template:
    metadata:
      labels:
        app: lab-reports
    spec:
      containers:
        - name: web
          image: nginx:1.27
          resources:
            requests:
              cpu: "50"
              memory: 64Mi
