apiVersion: v1
kind: Pod
metadata:
  name: pull-typo
spec:
  containers:
    - name: web
      image: ngnix:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-selector
spec:
  nodeSelector:
    disktype: ssd
  containers:
    - name: web
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-pvc
spec:
  containers:
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: does-not-exist
