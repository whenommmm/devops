<style>
:root{--bg:#fafafa;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--acc:#2f54eb;--ok:#1e7b34;--okbg:#e7f5ea;--bad:#b42318;--badbg:#fdeceb}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:8px 0 4px}.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}nav a{font-size:13px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--card)}
nav a .sc{color:var(--mute)}

h2{font-size:17px;margin:0 0 12px}
.q{padding:10px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{font-weight:600;margin-bottom:6px}
label{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;margin:2px 0;border-radius:8px;cursor:pointer}
label:hover{background:var(--bg)}input{margin-top:4px;accent-color:var(--acc)}

.mark{font-weight:700;margin-left:6px}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.res{font-weight:700}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
</style></head><body><div class="wrap">

<script>
const DATA=[{"s": "1", "t": "DevOps intro & roadmap", "qs": [{"n": 1, "q": "What is the primary objective of DevOps?", "o": ["Faster, reliable delivery through collaboration and automation", "Replace developers with servers", "Avoid version control", "Eliminate all testing"], "a": 0, "e": "DevOps joins development and operations so software ships often and safely; collaboration and automation are how it gets there."}, {"n": 2, "q": "What does CI mean?", "o": ["Central Installation", "Continuous Integration", "Cloud Inspection", "Code Isolation"], "a": 1, "e": "CI = Continuous Integration: developers merge small changes often, and every merge is automatically built and tested."}, {"n": 3, "q": "Which practice helps catch defects early?", "o": ["Manual deployment only", "Disabling logs", "Skipping code reviews", "Automated tests in CI"], "a": 3, "e": "Tests that run automatically on every push catch a bug minutes after it's written, long before production."}, {"n": 4, "q": "What is infrastructure as code?", "o": ["Keeping server settings undocumented", "Writing only frontend code", "Managing infrastructure using versioned configuration", "Purchasing hardware manually"], "a": 2, "e": "IaC = Infrastructure as Code: servers and networks are described in files kept in Git, so they can be reviewed, versioned and rebuilt identically."}, {"n": 5, "q": "Which tool is commonly used for source control?", "o": ["Prometheus", "Nginx", "Git", "Grafana"], "a": 2, "e": "Git is the standard version-control (source-control) tool; it records every change to the code."}, {"n": 6, "q": "What does a CI/CD pipeline automate?", "o": ["Build, test and delivery steps", "Employee attendance", "Domain purchases", "Keyboard configuration"], "a": 0, "e": "A pipeline automates the build → test → delivery steps that would otherwise be done by hand on every change."}, {"n": 7, "q": "Why are containers useful?", "o": ["They package applications with dependencies", "They remove the need for networks", "They guarantee zero bugs", "They replace all databases"], "a": 0, "e": "A container bundles the app with its libraries and settings, so it runs the same on any machine."}, {"n": 8, "q": "What is monitoring used for?", "o": ["Formatting YAML", "Compiling source code", "Tracking system health and behavior", "Creating Git branches"], "a": 2, "e": "Monitoring tracks health and behaviour (CPU, errors, response time) so problems are noticed and alerted on quickly."}, {"n": 9, "q": "Which mindset is central to DevOps?", "o": ["Shared ownership across development and operations", "Only manual changes", "Separate teams with no communication", "No production feedback"], "a": 0, "e": "DevOps culture = shared ownership: developers and operations are responsible for the software together, instead of 'throwing it over the wall'."}, {"n": 10, "q": "Which is a common DevOps lifecycle activity?", "o": ["Continuous feedback", "Disabling security scans", "Ignoring incidents", "One-time deployment forever"], "a": 0, "e": "Monitoring and user feedback flow back into planning; the DevOps lifecycle is a loop (Plan → Code → Build → Test → Release → Deploy → Operate → Monitor → Plan)."}]}, {"s": "2", "t": "Linux", "qs": [{"n": 1, "q": "Which command prints the working directory?", "o": ["mv", "ls", "cd", "pwd"], "a": 3, "e": "pwd = print working directory: shows the full path of the folder you are in."}, {"n": 2, "q": "Which command lists files including hidden files?", "o": ["pwd -a", "rm -a", "ls -a", "mkdir -a"], "a": 2, "e": "ls -a = list all, including hidden files whose names start with a dot (e.g. .bashrc)."}, {"n": 3, "q": "What does chmod change?", "o": ["File permissions", "Hostname", "File ownership only", "Network interface"], "a": 0, "e": "chmod = change mode: changes read/write/execute permissions, e.g. chmod 755 file (rwx r-x r-x)."}, {"n": 4, "q": "Which command searches text in files?", "o": ["pwd", "touch", "mv", "grep"], "a": 3, "e": "grep searches for a text pattern inside files and prints the matching lines (grep error app.log)."}, {"n": 5, "q": "Which command displays a file's contents?", "o": ["kill", "rmdir", "mkdir", "cat"], "a": 3, "e": "cat (concatenate) prints a file's contents to the screen."}, {"n": 6, "q": "What does the pipe operator do?", "o": ["Redirects all input to a file", "Runs commands only as root", "Deletes temporary files", "Passes one command's output to another"], "a": 3, "e": "The pipe | sends one command's output into the next command as input (ps aux | grep nginx)."}, {"n": 7, "q": "Which command shows running processes?", "o": ["cp", "ls", "ps", "mkdir"], "a": 2, "e": "ps = process status: lists running processes; ps aux shows every process."}, {"n": 8, "q": "Which command changes the current directory?", "o": ["cd", "echo", "pwd", "cat"], "a": 0, "e": "cd = change directory; cd .. goes up one level, cd ~ goes home."}, {"n": 9, "q": "What does sudo typically allow?", "o": ["Run commands with elevated privileges", "Download a container image", "Create a symbolic link", "Show DNS records"], "a": 0, "e": "sudo = 'superuser do': runs one command with root (administrator) privileges."}, {"n": 10, "q": "Which command displays disk space usage by filesystem?", "o": ["du -a", "uname -a", "free -m", "df -h"], "a": 3, "e": "df -h = disk free, in human-readable sizes, for each filesystem. (du shows how big a folder is.)"}]}, {"s": "3", "t": "Shell scripting", "qs": [{"n": 1, "q": "Which line commonly selects Bash as script interpreter?", "o": ["#bash/start", "//bin/bash", "#!/bin/bash", "#!/usr/git"], "a": 2, "e": "#!/bin/bash (the shebang) on line 1 tells the system which interpreter should run the script."}, {"n": 2, "q": "How do you reference the first positional argument in Bash?", "o": ["$0", "$#", "$?", "$1"], "a": 3, "e": "$1 is the first argument given to the script ($0 = the script's name, $# = how many arguments)."}, {"n": 3, "q": "Which operator tests whether a regular file exists in Bash?", "o": ["[ -p file ]", "[ -d file ]", "[ -f file ]", "[ -z file ]"], "a": 2, "e": "[ -f file ] is true when the path exists and is a regular file (-d = a directory, -e = exists at all)."}, {"n": 4, "q": "What does $? contain immediately after a command?", "o": ["Exit status of the previous command", "Current username", "Number of script lines", "Current process ID"], "a": 0, "e": "$? holds the exit status of the last command: 0 = success, anything else = failure."}, {"n": 5, "q": "Which loop iterates over a sequence of values?", "o": ["exit", "for", "case", "if"], "a": 1, "e": "for loops over a list of values: for f in *.log; do echo $f; done."}, {"n": 6, "q": "How do you make a script executable?", "o": ["grep +x script.sh", "pwd script.sh", "chmod +x script.sh", "cat +x script.sh"], "a": 2, "e": "chmod +x adds execute permission, so you can run the script as ./script.sh."}, {"n": 7, "q": "Which construct makes a conditional decision?", "o": ["for ... done", "echo ... print", "if ... then ... fi", "read ... exit"], "a": 2, "e": "if … then … fi makes a decision; fi ('if' backwards) closes the block."}, {"n": 8, "q": "How do you assign a variable in Bash?", "o": ["$NAME=value", "NAME=value", "set NAME := value", "NAME = value"], "a": 1, "e": "NAME=value assigns a variable, with no spaces around the =; read it back with $NAME."}, {"n": 9, "q": "Which command reads input from the terminal?", "o": ["touch", "echo", "printf", "read"], "a": 3, "e": "read waits for the user to type a line and stores it in a variable (read name)."}, {"n": 10, "q": "What does && mean between two commands?", "o": ["Run the second only if first fails", "Run the second only if the first succeeds", "Always run both in parallel", "Append output to a file"], "a": 1, "e": "a && b runs b only if a succeeded (exit 0); a || b runs b only if a failed."}]}, {"s": "4", "t": "Networking", "qs": [{"n": 1, "q": "What does DNS primarily do?", "o": ["Resolve names to IP addresses", "Build application binaries", "Schedule containers", "Encrypt disk volumes"], "a": 0, "e": "DNS = Domain Name System: turns names like google.com into IP addresses."}, {"n": 2, "q": "What does an IP address identify?", "o": ["A Docker image tag", "A CPU instruction", "A network interface on an IP network", "A Git repository"], "a": 2, "e": "An IP (Internet Protocol) address identifies one network interface, i.e. one connection of a machine, on an IP network."}, {"n": 3, "q": "Which protocol provides reliable ordered delivery?", "o": ["ICMP", "ARP", "TCP", "UDP"], "a": 2, "e": "TCP = Transmission Control Protocol: connection-based, resends lost data and keeps it in order. UDP is faster but guarantees nothing."}, {"n": 4, "q": "Which command can test basic ICMP reachability?", "o": ["ping", "git status", "chmod", "docker build"], "a": 0, "e": "ping sends ICMP (Internet Control Message Protocol) echo requests to check whether a host can be reached."}, {"n": 5, "q": "What does HTTP status 404 mean?", "o": ["Authentication succeeded", "Resource not found", "Successful request", "Server started"], "a": 1, "e": "404 Not Found: the server answered, but the requested path doesn't exist (4xx = a client-side error)."}, {"n": 6, "q": "What is the usual default port for HTTPS?", "o": ["22", "53", "443", "80"], "a": 2, "e": "HTTPS uses port 443 by default (HTTP 80, SSH 22, DNS 53)."}, {"n": 7, "q": "Which tool can make HTTP requests from a terminal?", "o": ["tar", "mkdir", "grep", "curl"], "a": 3, "e": "curl sends HTTP requests from the terminal (curl -I shows only the response headers)."}, {"n": 8, "q": "What does a subnet mask/prefix indicate?", "o": ["A Docker volume size", "A password length", "The network portion of an IP address", "A DNS TTL only"], "a": 2, "e": "A subnet mask or prefix (/24 = 255.255.255.0) says which part of an IP address is the network and which part is the host."}, {"n": 9, "q": "What is the role of a default gateway?", "o": ["Forward traffic to other networks", "Compile Java programs", "Start systemd services", "Resolve Git merge conflicts"], "a": 0, "e": "The default gateway (usually the router) forwards traffic that is going to other networks, such as the internet."}, {"n": 10, "q": "Which protocol is commonly used for secure remote shell access?", "o": ["DHCP", "FTP", "SSH", "SMTP"], "a": 2, "e": "SSH = Secure Shell: encrypted remote login, on port 22."}]}, {"s": "5", "t": "Git & GitHub", "qs": [{"n": 1, "q": "Which command initializes a local Git repository?", "o": ["git init", "git boot", "git create", "git start"], "a": 0, "e": "git init creates a new repository (the hidden .git folder) in the current folder."}, {"n": 2, "q": "Which command stages a file for commit?", "o": ["git fetch", "git log", "git add", "git push"], "a": 2, "e": "git add puts changes into the staging area, ready for the next commit."}, {"n": 3, "q": "Which command records staged changes?", "o": ["git status", "git diff", "git commit", "git clone"], "a": 2, "e": "git commit saves the staged changes as a snapshot, with a message (git commit -m \"…\")."}, {"n": 4, "q": "Which command shows the current working tree state?", "o": ["git status", "git branch -d", "git gc", "git tag -d"], "a": 0, "e": "git status shows which files are modified, staged or untracked (git diff shows the changed lines themselves)."}, {"n": 5, "q": "Which command creates a new branch?", "o": ["git reset feature", "git branch feature", "git commit feature", "git push feature"], "a": 1, "e": "git branch feature creates a branch but stays on the current one (git switch -c feature creates it and switches to it)."}, {"n": 6, "q": "Which command integrates another branch into the current branch?", "o": ["git fetch", "git clean", "git merge", "git stash"], "a": 2, "e": "git merge feature brings that branch's commits into the branch you are on."}, {"n": 7, "q": "What does git clone do?", "o": ["Deletes a remote branch", "Reverts the operating system", "Renames a commit", "Copies a repository to a local directory"], "a": 3, "e": "git clone copies a remote repository, with its full history, into a new local folder."}, {"n": 8, "q": "What is a pull request typically used for?", "o": ["Building a Docker layer", "Starting a Kubernetes pod", "Reviewing and discussing changes before merge", "Provisioning a VPC"], "a": 2, "e": "A pull request (PR) proposes merging a branch, so teammates can review and discuss the changes first."}, {"n": 9, "q": "What does .gitignore control?", "o": ["Which untracked paths Git should ignore", "Who can access GitHub", "The commit author", "The default remote URL"], "a": 0, "e": ".gitignore lists untracked files and folders Git should ignore (node_modules/, .env); files that are already tracked are not affected."}, {"n": 10, "q": "Which command uploads local commits to a remote?", "o": ["git diff", "git pull", "git push", "git show"], "a": 2, "e": "git push uploads your local commits to the remote repository (e.g. GitHub)."}]}, {"s": "6–7", "t": "Docker & Dockerfile", "qs": [{"n": 1, "q": "What is a Docker image?", "o": ["A running virtual machine only", "A Git branch", "A DNS record", "A read-only template for creating containers"], "a": 3, "e": "An image is a read-only template (the app plus its dependencies, in layers); a container is a running instance of it."}, {"n": 2, "q": "Which command builds an image from a Dockerfile?", "o": ["docker start", "docker logs", "docker build", "docker exec"], "a": 2, "e": "docker build -t name . builds an image from the Dockerfile in the current folder (the . is the build context)."}, {"n": 3, "q": "Which Dockerfile instruction sets the base image?", "o": ["COPY", "CMD", "EXPOSE", "FROM"], "a": 3, "e": "FROM sets the base image and must be the first instruction (FROM python:3.12-slim)."}, {"n": 4, "q": "Which Dockerfile instruction copies files into an image?", "o": ["USER", "WORKDIR", "COPY", "RUN"], "a": 2, "e": "COPY copies files from the build context into the image (COPY . /app)."}, {"n": 5, "q": "Which command lists running containers?", "o": ["docker images", "docker ps", "docker build", "docker pull"], "a": 1, "e": "docker ps lists running containers; docker ps -a also shows stopped ones."}, {"n": 6, "q": "What does docker run -p 8080:80 map?", "o": ["A volume to port 80", "Host port 80 to container port 8080", "Host port 8080 to container port 80", "Two host ports together"], "a": 2, "e": "-p 8080:80 means host port 8080 → container port 80 (host first, container second)."}, {"n": 7, "q": "What does docker logs show?", "o": ["Container standard output and error", "Registry credentials", "Git commit history", "Host kernel source"], "a": 0, "e": "docker logs shows what the container's main process wrote to stdout (standard output) and stderr (standard error)."}, {"n": 8, "q": "Which command executes a command inside a running container?", "o": ["docker exec", "docker save", "docker tag", "docker push"], "a": 0, "e": "docker exec runs a command inside a running container (docker exec -it web sh opens a shell)."}, {"n": 9, "q": "What is the purpose of .dockerignore?", "o": ["Block network access", "Ignore runtime errors", "Exclude paths from the build context", "Hide containers from ps"], "a": 2, "e": ".dockerignore keeps files (.git, node_modules, .env) out of the build context, so builds are faster and secrets stay out of images."}, {"n": 10, "q": "Which Dockerfile instruction defines a default command?", "o": ["LABEL", "ARG", "EXPOSE", "CMD"], "a": 3, "e": "CMD sets the default command a container runs when it starts; arguments after the image name in docker run replace it."}]}, {"s": "8", "t": "Docker networking, volumes & Compose", "qs": [{"n": 1, "q": "Why use Docker volumes?", "o": ["Increase CPU frequency", "Disable networking", "Persist data beyond a container lifecycle", "Replace container images"], "a": 2, "e": "A volume keeps data outside the container's writable layer, so the data survives removing the container."}, {"n": 2, "q": "Which command lists Docker volumes?", "o": ["docker volumes show", "docker storage ps", "docker volume ls", "docker volume ps"], "a": 2, "e": "docker volume ls lists volumes (docker volume inspect shows details such as where the data lives)."}, {"n": 3, "q": "What is a bind mount?", "o": ["A remote Git branch", "A Kubernetes namespace", "A host path mounted inside a container", "An image registry"], "a": 2, "e": "A bind mount maps a folder on the host into the container (-v /host/path:/container/path)."}, {"n": 4, "q": "Which Docker network driver is the typical default for standalone containers?", "o": ["overlay", "macvtap only", "host-only VM", "bridge"], "a": 3, "e": "bridge is the default network driver for standalone containers."}, {"n": 5, "q": "What does a user-defined bridge network provide?", "o": ["Host kernel upgrades", "Container-to-container name resolution", "Automatic cloud load balancing", "Persistent image layers"], "a": 1, "e": "A user-defined bridge network has built-in DNS, so containers reach each other by name (the default bridge doesn't do this)."}, {"n": 6, "q": "Which flag publishes a container port?", "o": ["-w", "-e", "-v", "-p"], "a": 3, "e": "-p (--publish) publishes a container port on the host so outside traffic can reach it."}, {"n": 7, "q": "Which command creates a Docker network?", "o": ["docker net init", "docker bridge build", "docker network create", "docker network push"], "a": 2, "e": "docker network create mynet creates a network; connect containers with --network mynet."}, {"n": 8, "q": "What is Docker Compose mainly for?", "o": ["Replacing source control", "Defining and running multi-container applications", "Managing Linux users", "Creating DNS root servers"], "a": 1, "e": "Compose defines and runs a multi-container application (e.g. web + database) from one YAML file."}, {"n": 9, "q": "Which file is commonly used by Docker Compose?", "o": ["Chart.yaml", "terraform.tfstate", "Jenkinsfile", "compose.yaml"], "a": 3, "e": "compose.yaml is Compose's file (the older name docker-compose.yml still works)."}, {"n": 10, "q": "Which command starts services from a Compose file?", "o": ["docker compose attach-all", "docker compose init-only", "docker compose up", "docker compose commit"], "a": 2, "e": "docker compose up (add -d for background) starts every service; docker compose down stops and removes them."}]}, {"s": "9", "t": "Kubernetes fundamentals", "qs": [{"n": 1, "q": "What is Kubernetes primarily used for?", "o": ["Replacing Git history", "Editing photos", "Compiling Linux kernels", "Orchestrating containerized applications"], "a": 3, "e": "Kubernetes orchestrates containers: it places them on machines, restarts failed ones, scales them and updates them."}, {"n": 2, "q": "What is a Kubernetes Pod?", "o": ["A Terraform provider", "A physical data center", "Smallest deployable unit containing one or more containers", "A Docker image registry"], "a": 2, "e": "A Pod is the smallest deployable unit: one or more containers that share one IP address and storage."}, {"n": 3, "q": "Which component stores Kubernetes cluster state?", "o": ["containerd", "CoreDNS", "etcd", "kube-proxy"], "a": 2, "e": "etcd is the key-value database that stores the whole cluster's state; only the API server talks to it."}, {"n": 4, "q": "Which component schedules Pods onto nodes?", "o": ["kube-scheduler", "kube-proxy", "kubectl", "kubelet"], "a": 0, "e": "kube-scheduler picks a node for each new Pod, based on free resources and constraints."}, {"n": 5, "q": "What does the kubelet do?", "o": ["Stores all cluster state", "Builds Helm charts", "Approves pull requests", "Ensures Pod containers run on a node"], "a": 3, "e": "The kubelet is the agent on every node that makes sure the Pod's containers are running."}, {"n": 6, "q": "What is kubectl?", "o": ["A Linux filesystem", "A CLI for interacting with the Kubernetes API", "A DNS protocol", "A container image format"], "a": 1, "e": "kubectl is the command-line tool that sends your requests to the Kubernetes API server."}, {"n": 7, "q": "Which command lists Pods?", "o": ["kubectl show nodes", "kubectl list images", "kubectl build pods", "kubectl get pods"], "a": 3, "e": "kubectl get pods lists the Pods in the current namespace (add -A for all namespaces)."}, {"n": 8, "q": "What is a Kubernetes namespace?", "o": ["A Dockerfile instruction", "A logical grouping for cluster resources", "A container image tag", "A dedicated physical server"], "a": 1, "e": "A namespace is a logical group, like a folder, for resources inside one cluster (default, kube-system…)."}, {"n": 9, "q": "Which component exposes the Kubernetes API?", "o": ["kubelet", "kube-apiserver", "CoreDNS", "kube-proxy"], "a": 1, "e": "kube-apiserver exposes the Kubernetes API; every kubectl command and every component goes through it."}, {"n": 10, "q": "What is a worker node?", "o": ["A DNS resolver record", "A GitHub workflow file", "A Helm repository", "A machine that runs application Pods"], "a": 3, "e": "A worker node is a machine that runs the application Pods (it has the kubelet, kube-proxy and a container runtime)."}]}, {"s": "10", "t": "Pods, ReplicaSets & Deployments", "qs": [{"n": 1, "q": "What is the purpose of a Deployment?", "o": ["Store cluster state", "Manage desired replicas and rolling updates", "Expose a public DNS zone", "Create container images"], "a": 1, "e": "A Deployment keeps the desired number of replicas running and performs rolling updates and rollbacks."}, {"n": 2, "q": "What does a ReplicaSet ensure?", "o": ["A desired number of matching Pods are running", "Nodes never fail", "Every Pod has a public IP", "All images are signed"], "a": 0, "e": "A ReplicaSet makes sure the desired number of Pods matching its selector are running."}, {"n": 3, "q": "Which field commonly sets Deployment replica count?", "o": ["status.desiredNodes", "spec.ports", "metadata.replicas", "spec.replicas"], "a": 3, "e": "spec.replicas sets how many Pods the Deployment wants."}, {"n": 4, "q": "What does a Pod label help with?", "o": ["Allocating disk partitions", "Installing Helm", "Selecting and organizing resources", "Encrypting image layers"], "a": 2, "e": "Labels are key=value tags (app=web) used to select and organise resources."}, {"n": 5, "q": "What is a label selector used for?", "o": ["Selecting Git commits by date", "Matching resources with specified labels", "Choosing Docker build stages", "Filtering shell history"], "a": 1, "e": "A label selector matches resources by their labels; Services and ReplicaSets use one to find their Pods."}, {"n": 6, "q": "Which command scales a Deployment?", "o": ["kubectl duplicate image", "kubectl increase node", "kubectl scale deployment", "kubectl resize pod"], "a": 2, "e": "kubectl scale deployment web --replicas=5 changes the number of replicas."}, {"n": 7, "q": "What happens when a Deployment Pod crashes?", "o": ["A controller works to restore desired state", "Git automatically rolls back", "Kubernetes deletes the Deployment permanently", "The cluster always stops"], "a": 0, "e": "The controller sees fewer Pods than desired and creates a replacement: this is self-healing."}, {"n": 8, "q": "Which command views rollout status?", "o": ["kubectl get dns", "kubectl rollout status deployment/name", "kubectl helm status", "kubectl logs nodes"], "a": 1, "e": "kubectl rollout status deployment/web waits and reports whether the rollout has finished."}, {"n": 9, "q": "What does a rolling update do?", "o": ["Gradually replace old Pods with new ones", "Change namespace ownership", "Restart the control plane", "Delete all nodes first"], "a": 0, "e": "A rolling update replaces old Pods with new ones a few at a time, so the app stays available."}, {"n": 10, "q": "Which resource usually creates and manages ReplicaSets?", "o": ["Secret", "PersistentVolume", "ConfigMap", "Deployment"], "a": 3, "e": "A Deployment creates and manages ReplicaSets (one per version), and each ReplicaSet manages the Pods."}]}, {"s": "11", "t": "Kubernetes Services", "qs": [{"n": 1, "q": "Why are Kubernetes Services used?", "o": ["Provide stable access to a set of Pods", "Compile application code", "Build container images", "Store Git history"], "a": 0, "e": "Pod IPs change whenever Pods are replaced; a Service gives one stable name and IP that load-balances across the matching Pods."}, {"n": 2, "q": "Which Service type is typically reachable only within the cluster?", "o": ["ClusterIP", "NodePort", "LoadBalancer", "ExternalName only"], "a": 0, "e": "ClusterIP (the default type) is reachable only from inside the cluster."}, {"n": 3, "q": "Which Service type exposes a port on each node?", "o": ["NodePort", "ExternalName", "Headless only", "ClusterIP"], "a": 0, "e": "NodePort opens the same port (30000–32767) on every node, so the app can be reached at <NodeIP>:<nodePort>."}, {"n": 4, "q": "Which Service type commonly provisions an external load balancer on supported clouds?", "o": ["LoadBalancer", "ClusterIP", "ExternalName", "Headless"], "a": 0, "e": "LoadBalancer asks the cloud provider for an external load balancer with a public IP."}, {"n": 5, "q": "How does a Service identify backend Pods?", "o": ["Label selector", "Node hostname only", "Git branch name", "Docker image digest"], "a": 0, "e": "A Service finds its Pods with a label selector; matching Pods that are Ready become its endpoints."}, {"n": 6, "q": "What does a Service port targetPort refer to?", "o": ["SSH port of the node", "Port on a Git remote", "Port on backend Pods", "Port of the API server"], "a": 2, "e": "targetPort is the port on the Pods where the app actually listens; port is the Service's own port."}, {"n": 7, "q": "What is the role of kube-proxy in many clusters?", "o": ["Build Dockerfiles", "Schedule Pods", "Store secrets in etcd", "Implement Service traffic routing rules"], "a": 3, "e": "kube-proxy runs on every node and writes the routing rules (iptables/IPVS) that send Service traffic to the Pods."}, {"n": 8, "q": "Which DNS name form can identify a Service across namespaces?", "o": ["pod.image.registry.local", "service.cluster.node.local", "service.namespace.svc.cluster.local", "namespace.service.github.io"], "a": 2, "e": "<service>.<namespace>.svc.cluster.local is the full DNS name; a short name like web only works within the same namespace."}, {"n": 9, "q": "What does a headless Service commonly set?", "o": ["replicas: 0", "type: NodePort", "hostNetwork: true", "clusterIP: None"], "a": 3, "e": "A headless Service sets clusterIP: None, so DNS returns the individual Pod IPs (used with StatefulSets)."}, {"n": 10, "q": "Which command lists Services?", "o": ["kubectl build svc", "kubectl init service", "kubectl get svc", "kubectl get images"], "a": 2, "e": "kubectl get svc (short for services) lists Services with their type, cluster IP and ports."}]}, {"s": "12", "t": "Ingress, ConfigMaps & Secrets", "qs": [{"n": 1, "q": "What does Ingress commonly define?", "o": ["HTTP/HTTPS routing rules to Services", "Git branch protections", "Node CPU architecture", "Container build steps"], "a": 0, "e": "An Ingress holds HTTP/HTTPS routing rules (by host name and URL path) that send requests to Services."}, {"n": 2, "q": "What is needed to implement Ingress rules?", "o": ["A Git tag", "A Terraform lock file", "A Docker registry only", "An Ingress controller"], "a": 3, "e": "Ingress rules do nothing until an Ingress controller (such as NGINX) runs in the cluster to apply them."}, {"n": 3, "q": "What is a ConfigMap intended to store?", "o": ["Persistent disk blocks", "Passwords by default", "Container images", "Non-sensitive configuration data"], "a": 3, "e": "A ConfigMap holds non-secret settings as key–value pairs, kept outside the image."}, {"n": 4, "q": "What is a Secret intended to store?", "o": ["Sensitive configuration values", "Container images", "Cluster logs only", "Helm binaries"], "a": 0, "e": "A Secret holds sensitive values: passwords, tokens, keys, certificates."}, {"n": 5, "q": "How can a ConfigMap be consumed by a Pod?", "o": ["Node kernel flags only", "Docker build cache only", "Git commit messages only", "Environment variables or mounted files"], "a": 3, "e": "A Pod uses a ConfigMap as environment variables (env / envFrom) or as files from a mounted volume."}, {"n": 6, "q": "What does a path rule in Ingress match?", "o": ["Container filesystem path", "The HTTP request path", "Host disk mount path", "Git remote path"], "a": 1, "e": "A path rule matches the URL path of the HTTP request (e.g. /api), not a folder on disk."}, {"n": 7, "q": "What does TLS termination usually provide at Ingress?", "o": ["Automatic Pod autoscaling", "Persistent volumes", "Build artifact signing", "HTTPS encryption for client connections"], "a": 3, "e": "TLS termination: the Ingress controller holds the certificate and handles HTTPS with the client, then forwards plain HTTP to the Pods."}, {"n": 8, "q": "Which command lists ConfigMaps?", "o": ["kubectl get configmaps", "kubectl get secrets-only", "kubectl get networks", "kubectl get charts"], "a": 0, "e": "kubectl get configmaps (short: cm) lists ConfigMaps."}, {"n": 9, "q": "Are Kubernetes Secret values encrypted merely because YAML uses base64?", "o": ["Yes, base64 is strong encryption", "No, base64 is encoding rather than encryption", "Yes, they are always hashed", "No, Secrets cannot contain strings"], "a": 1, "e": "base64 is encoding: anyone can reverse it with base64 -d, so it is not encryption."}, {"n": 10, "q": "Which Kubernetes resource commonly holds a TLS certificate and key for Ingress?", "o": ["ConfigMap", "Deployment", "Secret", "ServiceAccount only"], "a": 2, "e": "A Secret of type kubernetes.io/tls holds tls.crt and tls.key; the Ingress names it in tls.secretName."}]}, {"s": "13", "t": "Storage, HPA & Probes", "qs": [{"n": 1, "q": "What is a PersistentVolumeClaim (PVC)?", "o": ["A request for persistent storage", "A network firewall", "A container image", "A Git tag"], "a": 0, "e": "A PVC (PersistentVolumeClaim) is a Pod's request for storage: a size and an access mode."}, {"n": 2, "q": "What is a PersistentVolume (PV)?", "o": ["An Ingress controller", "A cluster storage resource", "A Deployment revision", "A DNS zone"], "a": 1, "e": "A PV (PersistentVolume) is an actual piece of storage in the cluster; a PVC binds to one."}, {"n": 3, "q": "What does a StorageClass help define?", "o": ["Which Git branch is default", "Which HTTP path is matched", "Which Dockerfile is used", "How dynamic storage provisioning occurs"], "a": 3, "e": "A StorageClass describes how to create storage automatically (dynamic provisioning) when a PVC asks for it."}, {"n": 4, "q": "What does HPA stand for?", "o": ["HTTP Proxy Adapter", "Helm Package Archive", "Horizontal Pod Autoscaler", "Host Port Allocator"], "a": 2, "e": "HPA = Horizontal Pod Autoscaler ('horizontal' = more or fewer Pods, not bigger Pods)."}, {"n": 5, "q": "What does an HPA commonly adjust?", "o": ["Container image contents", "Number of Pod replicas", "Git history", "Node operating system"], "a": 1, "e": "An HPA changes the number of Pod replicas based on metrics such as CPU use."}, {"n": 6, "q": "What does a readiness probe determine?", "o": ["Whether a container image exists", "Whether a container should receive traffic", "Whether Git is clean", "Whether a node is a control plane"], "a": 1, "e": "Readiness decides whether a Pod gets traffic; when it fails, the Pod is removed from the Service's endpoints but not restarted."}, {"n": 7, "q": "What does a liveness probe help detect?", "o": ["Whether a Service has a public IP", "Whether a volume is encrypted", "Whether Terraform is initialized", "When a container should be restarted"], "a": 3, "e": "Liveness detects a stuck container; when it fails, the kubelet restarts the container."}, {"n": 8, "q": "What does a startup probe help with?", "o": ["Allowing slow-starting apps time to initialize", "Provisioning a cloud account", "Creating a Docker network", "Checking Git credentials"], "a": 0, "e": "A startup probe gives slow-starting apps time to start; liveness and readiness wait until it passes."}, {"n": 9, "q": "What can happen if a Pod's PVC remains unbound?", "o": ["The image is rebuilt automatically", "The Pod may remain Pending", "The Pod is always Running", "The Deployment is deleted"], "a": 1, "e": "A Pod that needs a PVC which can't be bound cannot be scheduled, so it stays Pending."}, {"n": 10, "q": "Which command lists PVCs?", "o": ["kubectl get hpa-only", "kubectl get routes", "kubectl get mounts", "kubectl get pvc"], "a": 3, "e": "kubectl get pvc lists claims and their status (Bound or Pending)."}]}, {"s": "14", "t": "Kubernetes troubleshooting", "qs": [{"n": 1, "q": "Which command gives a quick overview of Pod status?", "o": ["kubectl get pods", "kubectl publish", "kubectl init", "kubectl build pods"], "a": 0, "e": "kubectl get pods gives the quick overview: READY, STATUS, RESTARTS and AGE."}, {"n": 2, "q": "Which command displays detailed Pod events and conditions?", "o": ["kubectl top namespace", "kubectl apply -k", "kubectl delete pod", "kubectl describe pod"], "a": 3, "e": "kubectl describe pod shows the details: conditions, Last State, exit codes and, at the bottom, the Events."}, {"n": 3, "q": "Which command reads a container's logs?", "o": ["kubectl version", "kubectl create", "kubectl label", "kubectl logs"], "a": 3, "e": "kubectl logs reads what a container printed (add --previous for the copy that crashed)."}, {"n": 4, "q": "Which command runs a command inside a running container?", "o": ["kubectl exec", "kubectl config view", "kubectl explain", "kubectl diff"], "a": 0, "e": "kubectl exec runs a command inside a running container (kubectl exec -it <pod> -- sh)."}, {"n": 5, "q": "What often causes ImagePullBackOff?", "o": ["An oversized log file only", "A healthy application", "A missing readiness probe only", "An image cannot be downloaded"], "a": 3, "e": "ImagePullBackOff means the image can't be downloaded: wrong name or tag, or a private registry without a login."}, {"n": 6, "q": "What often causes CrashLoopBackOff?", "o": ["A stable Service IP", "A container repeatedly exits or crashes", "A successful rollout", "A valid PVC"], "a": 1, "e": "CrashLoopBackOff means the container keeps exiting and Kubernetes keeps restarting it, waiting longer each time."}, {"n": 7, "q": "What is a common reason for a Pod to remain Pending?", "o": ["Successful readiness probe", "Correct image tag", "Healthy DNS", "Insufficient schedulable resources"], "a": 3, "e": "Pending usually means no node has enough unreserved CPU/memory for the Pod's requests (or a selector, taint or PVC blocks it)."}, {"n": 8, "q": "Where can you see recent scheduling or pull errors?", "o": ["Kubernetes Events", "Git tags", "Docker Hub stars", "Helm templates only"], "a": 0, "e": "Events (bottom of describe, or kubectl get events) record scheduling failures and image-pull errors."}, {"n": 9, "q": "What should you check if a Service has no endpoints?", "o": ["Only the Git commit message", "Whether its selector matches ready Pods", "Only the cluster timezone", "Only Docker build cache"], "a": 1, "e": "No endpoints → check that the Service's selector matches the Pods' labels and that those Pods are Ready."}, {"n": 10, "q": "What is the final step after fixing an incident?", "o": ["Delete all logs", "Disable probes", "Verify the workload behaves correctly", "Skip testing"], "a": 2, "e": "After any fix, verify that the workload really works: Running and Ready, endpoints present, a test request succeeds."}]}, {"s": "15", "t": "Helm", "qs": [{"n": 1, "q": "What is Helm?", "o": ["A package manager for Kubernetes", "A container runtime", "A network protocol", "A cloud hypervisor"], "a": 0, "e": "Helm is a package manager for Kubernetes, like apt or pip but for apps on a cluster."}, {"n": 2, "q": "What is a Helm chart?", "o": ["A persistent disk", "A running Pod", "A Git branch", "A package of Kubernetes templates and metadata"], "a": 3, "e": "A chart is a package: Kubernetes YAML templates plus default values plus metadata."}, {"n": 3, "q": "What is Chart.yaml used for?", "o": ["Pod runtime logs", "Ingress certificates", "Chart metadata such as name and version", "Terraform state"], "a": 2, "e": "Chart.yaml holds metadata: name, version (of the chart), appVersion (of the app), apiVersion v2."}, {"n": 4, "q": "What is values.yaml used for?", "o": ["Default configurable values for templates", "Git merge history", "Container registry authentication only", "Linux process IDs"], "a": 0, "e": "values.yaml holds the default values that fill the templates' blanks; override them with -f or --set."}, {"n": 5, "q": "Which command creates a starter chart?", "o": ["helm pod create", "helm create", "helm chart start", "helm init cluster"], "a": 1, "e": "helm create <name> scaffolds a starter chart folder."}, {"n": 6, "q": "Which command installs a chart release?", "o": ["helm install", "helm push pod", "helm apply", "helm deploy node"], "a": 0, "e": "helm install <release> <chart> installs a chart as a named release."}, {"n": 7, "q": "Which command updates an installed release?", "o": ["helm restart node", "helm rerun", "helm upgrade", "helm patch image"], "a": 2, "e": "helm upgrade changes an installed release (new values or a new chart) and records a new revision."}, {"n": 8, "q": "Which command returns to an earlier release revision?", "o": ["helm revert image", "helm reset cluster", "helm rollback", "helm undo commit"], "a": 2, "e": "helm rollback <release> <revision> returns to an earlier revision (recorded as a new revision number)."}, {"n": 9, "q": "Which flag can override a value on the command line?", "o": ["--copy", "--set", "--port-forward", "--replace-node"], "a": 1, "e": "--set key=value overrides a value on the command line; it beats values.yaml and -f files."}, {"n": 10, "q": "Which command renders templates without installing?", "o": ["helm template", "helm render-pod", "helm build-image", "helm dryrun-cluster"], "a": 0, "e": "helm template renders the final YAML on your machine without installing anything."}]}, {"s": "16", "t": "CI/CD & GitHub Actions", "qs": [{"n": 1, "q": "Where are GitHub Actions workflow files normally stored?", "o": [".github/workflows/", ".kube/actions/", ".git/actions/", ".docker/workflows/"], "a": 0, "e": "Workflow files must live in .github/workflows/ (exact folder name); anywhere else they are ignored."}, {"n": 2, "q": "Which YAML key specifies workflow triggers?", "o": ["jobs", "env", "on", "steps"], "a": 2, "e": "on: lists the triggers (push, pull_request, schedule, workflow_dispatch)."}, {"n": 3, "q": "What is a job in GitHub Actions?", "o": ["A Docker volume", "A Kubernetes Service", "A group of steps run on a runner", "A Git branch"], "a": 2, "e": "A job is a group of steps that run on one runner; jobs run in parallel unless needs: orders them."}, {"n": 4, "q": "What does runs-on specify?", "o": ["Runner environment for a job", "Git default branch", "Kubernetes namespace", "Target Docker registry"], "a": 0, "e": "runs-on chooses the runner, the machine the job runs on (e.g. ubuntu-latest)."}, {"n": 5, "q": "Which action commonly checks out repository code?", "o": ["actions/checkout", "actions/setup-dockerhub", "github/create-branch", "runner/load-repo"], "a": 0, "e": "actions/checkout copies the repository's code onto the runner; it's almost always step 1."}, {"n": 6, "q": "What does a step's run field do?", "o": ["Executes shell commands", "Defines a Docker image digest", "Schedules a Kubernetes node", "Creates a cloud VPC automatically"], "a": 0, "e": "run: executes shell commands on the runner."}, {"n": 7, "q": "What does a step's uses field do?", "o": ["Creates a new repository", "Writes Terraform state", "Invokes a reusable action", "Starts an SSH daemon"], "a": 2, "e": "uses: runs a ready-made reusable action, written owner/repo@version."}, {"n": 8, "q": "How should sensitive tokens be supplied to workflows?", "o": ["GitHub Actions secrets", "Committed to README", "Hardcoded in YAML", "Printed to logs"], "a": 0, "e": "Store tokens as GitHub Actions secrets and read them as ${{ secrets.NAME }}; they appear as *** in logs."}, {"n": 9, "q": "What does needs do between jobs?", "o": ["Set Git author", "Select a Dockerfile stage", "Define container port mapping", "Declare job dependencies"], "a": 3, "e": "needs: makes a job wait for (depend on) other jobs; if they fail, it is skipped."}, {"n": 10, "q": "Which trigger runs a workflow on code pushes?", "o": ["push", "docker-build", "commit-only", "upload"], "a": 0, "e": "on: push runs the workflow whenever commits are pushed."}]}, {"s": "17", "t": "Complete CI/CD & DevSecOps", "qs": [{"n": 1, "q": "What is DevSecOps?", "o": ["Avoiding dependency updates", "Replacing CI with manual reviews", "Running security only after release", "Integrating security throughout development and delivery"], "a": 3, "e": "DevSecOps builds security into every stage of development and delivery, not just a check at the end."}, {"n": 2, "q": "What does SAST analyze?", "o": ["Source code or binaries without executing the application", "Only production traffic", "Only DNS responses", "Only Kubernetes events"], "a": 0, "e": "SAST (Static Application Security Testing) analyses source code without running it (white-box)."}, {"n": 3, "q": "What does DAST test?", "o": ["Only Git commit messages", "Only Docker layers", "A running application from the outside", "Only static source code"], "a": 2, "e": "DAST (Dynamic Application Security Testing) attacks the running app from the outside (black-box)."}, {"n": 4, "q": "What does dependency scanning identify?", "o": ["Known vulnerabilities in third-party packages", "Unused shell aliases", "Missing Git branches", "Slow DNS queries"], "a": 0, "e": "Dependency scanning (SCA, Software Composition Analysis) finds known vulnerabilities (CVEs) in third-party packages."}, {"n": 5, "q": "What does container image scanning inspect?", "o": ["Only Kubernetes Service names", "Image packages and known vulnerabilities", "Only developer laptops", "Only branch protections"], "a": 1, "e": "Image scanning (e.g. Trivy) checks the image's OS packages and libraries for known vulnerabilities."}, {"n": 6, "q": "What is the principle of least privilege?", "o": ["Disable authentication", "Grant only permissions required", "Share one token everywhere", "Grant administrator rights to all"], "a": 1, "e": "Least privilege: give each user or program only the permissions it needs, nothing more."}, {"n": 7, "q": "Why should secrets not be committed to Git?", "o": ["They may be exposed through repository history", "They break YAML parsing", "Git cannot store text", "They prevent all merges"], "a": 0, "e": "Git keeps every commit forever, so a committed secret stays in the history even after deletion; it must be revoked."}, {"n": 8, "q": "What is an SBOM?", "o": ["Software Bill of Materials listing components", "Secure Backup Operating Mode", "Source Branch Ownership Matrix", "Server Build Output Map"], "a": 0, "e": "SBOM = Software Bill of Materials: a list of every component, and its version, inside the software."}, {"n": 9, "q": "What is a common purpose of a security gate in CI?", "o": ["Disable audit logs", "Block promotion when policy checks fail", "Allow all vulnerabilities", "Skip all unit tests"], "a": 1, "e": "A security gate stops the pipeline (blocks promotion) when a check fails, e.g. a scanner exiting with code 1."}, {"n": 10, "q": "What does shift-left security mean?", "o": ["Run security checks earlier in development", "Move production servers physically", "Only scan after deployment", "Remove review from pipelines"], "a": 0, "e": "Shift-left = run security checks early (on commit or PR), where problems are cheapest to fix."}]}, {"s": "18", "t": "Terraform & IaC", "qs": [{"n": 1, "q": "What is Terraform used for?", "o": ["Writing application unit tests", "Serving static HTML only", "Monitoring CPU usage only", "Provisioning and managing infrastructure as code"], "a": 3, "e": "Terraform provisions and manages infrastructure from code files (IaC, Infrastructure as Code)."}, {"n": 2, "q": "Which command initializes providers and backend?", "o": ["terraform output", "terraform destroy", "terraform apply", "terraform init"], "a": 3, "e": "terraform init downloads the providers and sets up the backend (where state is kept); always run it first."}, {"n": 3, "q": "Which command previews infrastructure changes?", "o": ["terraform show-only", "terraform plan", "terraform state rm", "terraform fmt"], "a": 1, "e": "terraform plan previews what will be created, changed or destroyed, without changing anything."}, {"n": 4, "q": "Which command applies the planned changes?", "o": ["terraform fmt", "terraform validate", "terraform apply", "terraform graph"], "a": 2, "e": "terraform apply carries out the planned changes (it asks you to type yes)."}, {"n": 5, "q": "What does Terraform state track?", "o": ["Only shell command history", "Only application logs", "Mappings between configuration and managed resources", "Only Docker images"], "a": 2, "e": "The state file (terraform.tfstate) maps each resource in your code to the real object it created."}, {"n": 6, "q": "What is a Terraform provider?", "o": ["A Kubernetes Pod", "Plugin for interacting with an API or platform", "A Linux package manager", "A Git commit"], "a": 1, "e": "A provider is a plugin that talks to one platform's API (aws, azurerm, google, local…)."}, {"n": 7, "q": "What is a Terraform module?", "o": ["Reusable group of Terraform configuration", "A DNS record type", "A container image", "An HTTP load balancer"], "a": 0, "e": "A module is a reusable group of Terraform configuration: a folder of .tf files that you call from other code."}, {"n": 8, "q": "Which command checks Terraform configuration syntax and consistency?", "o": ["terraform destroy", "terraform output", "terraform import", "terraform validate"], "a": 3, "e": "terraform validate checks syntax and internal consistency, without contacting the cloud."}, {"n": 9, "q": "What is a variable in Terraform?", "o": ["An automatically encrypted password", "An input used to parameterize configuration", "A Helm release", "A running cloud VM"], "a": 1, "e": "A variable is an input (variable \"region\" {…}) that parameterises the configuration."}, {"n": 10, "q": "Why use a remote backend with locking?", "o": ["Share state safely and reduce concurrent update conflicts", "Run Pods without nodes", "Replace all version control", "Eliminate the need for credentials"], "a": 0, "e": "A remote backend (e.g. S3) lets the team share one state file; locking stops two applies running at the same time."}]}, {"s": "19", "t": "Cloud & Terraform in action", "qs": [{"n": 1, "q": "What does IaaS provide?", "o": ["Virtualized infrastructure such as compute and networks", "Only email templates", "Only finished end-user applications", "Only source code hosting"], "a": 0, "e": "IaaS (Infrastructure as a Service) gives you virtual machines, networks and storage; you manage the OS and everything above it (e.g. AWS EC2)."}, {"n": 2, "q": "What does PaaS primarily provide?", "o": ["Raw CPU chips only", "Only Git branches", "Managed platform for deploying applications", "Only DNS records"], "a": 2, "e": "PaaS (Platform as a Service) gives a managed platform; you only deploy your code (e.g. Heroku, Elastic Beanstalk)."}, {"n": 3, "q": "What does SaaS typically deliver?", "o": ["An unmanaged hypervisor", "A local kernel module", "Ready-to-use software over a network", "A raw storage controller"], "a": 2, "e": "SaaS (Software as a Service) is ready-to-use software over the internet (e.g. Gmail)."}, {"n": 4, "q": "What is a cloud region?", "o": ["A geographic area containing cloud infrastructure", "A container tag", "A single application process", "A Git repository"], "a": 0, "e": "A region is a geographic area (e.g. ap-south-1, Mumbai) that contains several data centres."}, {"n": 5, "q": "What is an availability zone?", "o": ["An isolated infrastructure location within a region", "A Kubernetes label only", "A Terraform variable", "A GitHub runner type"], "a": 0, "e": "An AZ (Availability Zone) is an isolated data-centre location inside a region; using two or more gives high availability."}, {"n": 6, "q": "What is a VPC?", "o": ["A logically isolated virtual network", "A container image", "A managed source code editor", "A version control protocol"], "a": 0, "e": "A VPC (Virtual Private Cloud) is your own isolated virtual network in the cloud (Azure calls it a VNet)."}, {"n": 7, "q": "What is a subnet?", "o": ["A Git branch", "A CI pipeline stage", "An IP address range within a network", "A Docker build layer"], "a": 2, "e": "A subnet is a smaller range of IP addresses (e.g. 10.0.1.0/24) inside the VPC, placed in one AZ."}, {"n": 8, "q": "What does a route table define?", "o": ["Where network traffic should be forwarded", "Terraform module version", "Container restart count", "Application test coverage"], "a": 0, "e": "A route table says where traffic is sent; a route 0.0.0.0/0 → internet gateway makes a subnet public."}, {"n": 9, "q": "What does a security group commonly control?", "o": ["CPU instruction set", "YAML indentation", "Git merge policy", "Allowed inbound and outbound network traffic"], "a": 3, "e": "A security group is a stateful virtual firewall listing the inbound and outbound traffic allowed for an instance."}, {"n": 10, "q": "Why combine Terraform with cloud services?", "o": ["Reproducible, versioned infrastructure provisioning", "To compile frontend code", "To remove the need for networks", "To avoid reviewing changes"], "a": 0, "e": "Terraform + cloud = reproducible, version-controlled infrastructure that can be recreated identically."}]}, {"s": "20", "t": "Monitoring, Observability & GitOps", "qs": [{"n": 1, "q": "What is a metric?", "o": ["A YAML parser", "A complete container image", "A Git branch", "A numeric measurement over time"], "a": 3, "e": "A metric is a number measured over time (CPU %, requests per second)."}, {"n": 2, "q": "What is a log?", "o": ["A cloud region", "A persistent volume claim", "A DNS subnet", "A timestamped record of events"], "a": 3, "e": "A log is a timestamped record of an event: one line per thing that happened."}, {"n": 3, "q": "What is a distributed trace?", "o": ["A view of a request across services", "A Docker image tag", "A Git commit hash only", "A shell variable"], "a": 0, "e": "A distributed trace follows one request across many services and shows the time spent in each."}, {"n": 4, "q": "What is Prometheus commonly used for?", "o": ["Building Docker images", "Provisioning VPCs", "Collecting and querying time-series metrics", "Hosting Git repositories"], "a": 2, "e": "Prometheus scrapes (pulls) metrics from targets and stores them as time series; you query them with PromQL."}, {"n": 5, "q": "What is Grafana commonly used for?", "o": ["Visualizing metrics and creating dashboards", "Building Helm charts", "Scanning source code", "Scheduling Kubernetes Pods"], "a": 0, "e": "Grafana visualises data in dashboards and panels, using sources like Prometheus; it stores no metrics itself."}, {"n": 6, "q": "What does observability help engineers do?", "o": ["Avoid all incident response", "Infer internal system behavior from telemetry", "Disable logs", "Replace application testing"], "a": 1, "e": "Observability = being able to understand what's happening inside a system from its telemetry (metrics, logs, traces)."}, {"n": 7, "q": "What is GitOps?", "o": ["Replacing Kubernetes with Git", "Storing passwords in plaintext", "Running all changes manually", "Managing desired system state through version-controlled Git"], "a": 3, "e": "GitOps keeps the desired state in Git, and an agent (e.g. Argo CD) makes the cluster match it."}, {"n": 8, "q": "In GitOps, what is the source of truth?", "o": ["An untracked server file", "A developer's local terminal", "A random running Pod", "The desired configuration stored in Git"], "a": 3, "e": "In GitOps, the desired configuration stored in Git is the single source of truth."}, {"n": 9, "q": "What is Argo CD commonly used for?", "o": ["Reconciling Kubernetes deployments with Git", "Creating Docker base images", "Resolving DNS on a laptop", "Compiling Java source code"], "a": 0, "e": "Argo CD reconciles (syncs) the cluster with the manifests stored in Git."}, {"n": 10, "q": "What does configuration drift mean?", "o": ["Actual state differs from declared desired state", "All Pods have identical images", "Every Git branch is merged", "Metrics are stored in a database"], "a": 0, "e": "Drift = the real state differs from the declared desired state, e.g. after a manual kubectl change."}]}];
let picks={};try{picks=JSON.parse(localStorage.getItem('devopsPicks')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('devopsPicks',JSON.stringify(picks))}catch(e){}};
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sid=s=>'s'+s.replace(/\D/g,'');
const app=document.getElementById('app'),nav=document.getElementById('nav');
app.innerHTML=DATA.map(S=>`<section id="${sid(S.s)}"><h2>Session ${S.s} · ${esc(S.t)}</h2>`+
 S.qs.map(q=>{const k=S.s+'.'+q.n;return `<div class="q" data-k="${k}"><div class="qt">${S.s}.${q.n} ${esc(q.q)}<span class="mark"></span></div>`+
 q.o.map((o,i)=>`<label><input type="radio" name="${k}" value="${i}" ${picks[k]===i?'checked':''}><span><b>${'ABCD'[i]}.</b> ${esc(o)}</span></label>`).join('')+
 `<div class="ex">💡 ${esc(q.e)}</div></div>`}).join('')+
 `<div class="row"><button class="pri" data-check="${S.s}">Check Session ${S.s}</button><button data-clear="${S.s}">Clear</button><span class="res" id="r${sid(S.s)}"></span></div></section>`).join('');
nav.innerHTML=DATA.map(S=>`<a href="#${sid(S.s)}">${S.s} <span class="sc" id="n${sid(S.s)}"></span></a>`).join('');
app.addEventListener('change',e=>{if(e.target.type==='radio'){picks[e.target.name]=+e.target.value;save();}});
function checkSession(S){let ok=0,ans=0;
 S.qs.forEach(q=>{const k=S.s+'.'+q.n,el=app.querySelector(`.q[data-k="${k}"]`),p=picks[k],labs=el.querySelectorAll('label'),m=el.querySelector('.mark');
  labs.forEach(l=>l.classList.remove('ok','bad'));el.classList.add('checked');labs[q.a].classList.add('ok');
  if(p===undefined){m.textContent='— not answered';m.className='mark bad'}
  else{ans++;if(p===q.a){ok++;m.textContent='✓';m.className='mark ok'}else{labs[p].classList.add('bad');m.textContent='✗';m.className='mark bad'}}});
 document.getElementById('r'+sid(S.s)).textContent=`${ok}/${S.qs.length} correct`+(ans<S.qs.length?` (${S.qs.length-ans} unanswered)`:'');
 document.getElementById('n'+sid(S.s)).textContent=`${ok}/${S.qs.length}`;return ok;}
function clearSession(S){S.qs.forEach(q=>{const k=S.s+'.'+q.n,el=app.querySelector(`.q[data-k="${k}"]`);delete picks[k];
 el.classList.remove('checked');el.querySelectorAll('input').forEach(i=>i.checked=false);el.querySelectorAll('label').forEach(l=>l.classList.remove('ok','bad'));el.querySelector('.mark').textContent='';});
 document.getElementById('r'+sid(S.s)).textContent='';document.getElementById('n'+sid(S.s)).textContent='';save();}
app.addEventListener('click',e=>{const c=e.target.dataset.check,cl=e.target.dataset.clear;
 if(c)checkSession(DATA.find(S=>S.s===c));if(cl)clearSession(DATA.find(S=>S.s===cl));});
document.getElementById('checkAll').onclick=()=>{const t=DATA.reduce((a,S)=>a+checkSession(S),0);document.getElementById('total').textContent=`Total: ${t}/190 (${Math.round(t/1.9)}%)`;};
document.getElementById('clearAll').onclick=()=>{if(confirm('Clear all your ticks?')){DATA.forEach(clearSession);document.getElementById('total').textContent='';}};
</script></body></html>
